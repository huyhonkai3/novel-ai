services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel_dev_password
      POSTGRES_DB: novel_ai

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - novel_ai_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  novel_ai_pgdata: